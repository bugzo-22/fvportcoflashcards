    COMPANIES.find(c => c.id === companyId)?.cards.filter((_, i) => studied[`${companyId}-${i}`]).length || 0;

  const totalStudied = Object.keys(studied).length;
  const totalCards = COMPANIES.reduce((sum, c) => sum + c.cards.length, 0);

  const startQuiz = () => {
    const all = [];
    COMPANIES.forEach(c => c.cards.forEach(card => all.push({ ...card, company: c.name, color: c.color, emoji: c.emoji })));
    const shuffled = all.sort(() => Math.random() - 0.5).slice(0, 15);
    setQuizCards(shuffled);
    setQuizIndex(0);
    setQuizScore(0);
    setQuizRevealed(false);
    setView("quiz");
  };

    "🔬 AI / ML & Foundation Models": filtered.filter(c => ["ricursive","periodic","datology","simular","skild","poolside","lmarena","standard_kernel"].includes(c.id)),
    "⚡ Energy & Infrastructure": filtered.filter(c => ["crusoe","radiant","exowatt","armada"].includes(c.id)),
    "🛠️ Developer Tools & Platforms": filtered.filter(c => ["chalk","n8n","supabase","semgrep","runway","runlayer","unsiloed"].includes(c.id)),
    "🔒 Security & Defense": filtered.filter(c => ["vannevar","corridor"].includes(c.id)),
    "📊 Other Priority": filtered.filter(c => ["artemis","sphere","entire"].includes(c.id)),
  };

            </div>
          </div>

          <div style={{ display: "flex", gap: 8, marginBottom: 24 }}>
            <input

                      <button key={c.id} onClick={() => { setSelectedCompany(c); setCardIndex(0); setFlipped(false); setView("study"); }}

                        onMouseLeave={e => { e.currentTarget.style.borderColor = done ? c.color + "44" : "#1a1a2a"; e.currentTarget.style.transform = "none"; }}

      <div style={{ fontFamily: "'DM Sans', 'Helvetica Neue', sans-serif", background: "#08080e", minHeight: "100vh", color: "#e2e8f0", padding: "20px 16px" }}>
        <div style={{ maxWidth: 640, margin: "0 auto" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <button onClick={() => setView("menu")} style={{ background: "none", border: "none", color: "#64748b", cursor: "pointer", fontSize: 13 }}>← Exit</button>
            <span style={{ fontSize: 13, color: "#64748b" }}>Q{quizIndex + 1}/{quizCards.length} · Score: {quizScore}</span>
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10 }}>
            <span style={{ fontSize: 16 }}>{qCard.emoji}</span>
            <span style={{ fontWeight: 600, color: qCard.color, fontSize: 13 }}>{qCard.company}</span>
            <span style={{ fontSize: 10, color: "#4b5563", background: "#151520", padding: "2px 6px", borderRadius: 4 }}>{qCard.cat}</span>
          </div>

          <div onClick={() => setQuizRevealed(true)} style={{
            background: "#0f0f18", border: `1px solid ${qCard.color}22`, borderRadius: 14, padding: 28,
            marginBottom: 14, minHeight: quizRevealed ? "auto" : 180,
            display: "flex", flexDirection: "column", justifyContent: "center",
            cursor: quizRevealed ? "default" : "pointer"
          }}>
            <div style={{ fontSize: 17, fontWeight: 600, lineHeight: 1.5, marginBottom: quizRevealed ? 16 : 0 }}>{qCard.front}</div>
            {!quizRevealed && <div style={{ fontSize: 11, color: "#4b5563", marginTop: 10 }}>tap to reveal</div>}
            {quizRevealed && (
              <div style={{ borderTop: `1px solid ${qCard.color}22`, paddingTop: 14, fontSize: 13.5, lineHeight: 1.75, whiteSpace: "pre-line", color: "#cbd5e1" }}>
                {qCard.back}
              </div>
            )}
          </div>

          {quizRevealed && (
            <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
              <button onClick={() => { setQuizIndex(quizIndex + 1); setQuizRevealed(false); }}
                style={{ padding: "10px 28px", background: "#dc2626", border: "none", borderRadius: 8, color: "#fff", fontWeight: 600, cursor: "pointer", fontSize: 13 }}>
                ✗ Didn't know
              </button>
              <button onClick={() => { setQuizScore(quizScore + 1); setQuizIndex(quizIndex + 1); setQuizRevealed(false); }}
                style={{ padding: "10px 28px", background: "#16a34a", border: "none", borderRadius: 8, color: "#fff", fontWeight: 600, cursor: "pointer", fontSize: 13 }}>
                ✓ Got it!
              </button>
            </div>
          )}
        </div>
      </div>
    );
  }
  return null;
}


ReactDOM.createRoot(document.getElementById('root')).render(<FlashcardApp />);
</script>
</body>
</html>
